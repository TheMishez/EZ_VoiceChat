; Reference copy of the EZ server settings. docker-compose.yml applies these through
; MUMBLE_CONFIG_* variables; use this file directly only for a non-Docker install.
; EZ server settings for Mumble (murmur). Tuned for small competitive teams:
; Opus only, high bitrate allowed, no recording, no slow fallbacks.
database=/var/lib/mumble-server/mumble-server.sqlite
port=64738
host=

; Voice quality: allow up to 128 kbps per speaker (EZ VoiceChat defaults to 64 kbps).
bandwidth=144000
; Force Opus for everyone (no CELT/Speex fallback that would add latency or lower quality).
opusthreshold=0

users=100
usersperchannel=0
timeout=30

; Privacy: no recording, no server-side message logging beyond the defaults.
allowRecording=false
logdays=7

; Text chat limits
textmessagelength=5000
imagemessagelength=0
allowhtml=true

; Make the server joinable by name without a client certificate prompt.
certrequired=false
sendversion=true
rememberchannel=true
defaultchannel=0

; Anti-spam
autobanAttempts=10
autobanTimeframe=120
autobanTime=300

[Ice]
Ice.Warn.UnknownProperties=1
Ice.MessageSizeMax=65536
