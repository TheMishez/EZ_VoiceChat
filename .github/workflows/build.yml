name: Build EZ VoiceChat

# - Every push to main (and pull requests): builds the installer; grab it from the run's Artifacts.
# - Publishing a GitHub release tagged vX.Y.Z: builds and attaches the installer to the release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # libopus (audiopus_sys) ships an old CMakeLists that CMake 4 refuses without this.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crypt-test

      - name: Test Mumble voice encryption
        run: cargo test --manifest-path crypt-test/Cargo.toml

      - name: Compile check
        shell: bash
        run: |
          set -o pipefail
          cd src-tauri
          if ! cargo check --release --message-format=short 2>&1 | tee ../check.log; then
            grep -E '^[^ ]+:[0-9]+:[0-9]+: error' ../check.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E '^error' ../check.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Install Tauri CLI
        run: npm install

      - name: Build EZ VoiceChat
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EZ-VoiceChat-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release upload $env:TAG "$($f.FullName)" --clobber
