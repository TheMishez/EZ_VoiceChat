name: Build EZ VoiceChat

# - Every push to main (and pull requests): builds the installer; grab it from the run's Artifacts.
# - Publishing a GitHub release tagged vX.Y.Z, or pushing a tag vX.Y.Z: builds the installer and
#   attaches it to that release (creating the release from .github/release-notes.md if needed).
#   Installed copies then update themselves.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # libopus (audiopus_sys) ships an old CMakeLists that CMake 4 refuses without this.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crypt-test

      - name: Test Mumble voice encryption
        run: cargo test --manifest-path crypt-test/Cargo.toml

      - name: Compile check
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cd src-tauri
          if ! cargo check --release --message-format=short 2>&1 | tee ../check.log; then
            grep -E '^[^ ]+:[0-9]+:[0-9]+: error' ../check.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E '^error' ../check.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Install Tauri CLI
        run: npm install

      - name: Build EZ VoiceChat
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EZ-VoiceChat-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG.TrimStart('v') -ne $v) {
            Write-Error "Tag $env:TAG doesn't match version $v in src-tauri/tauri.conf.json. Bump the version there and in src-tauri/Cargo.toml."
            exit 1
          }
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "EZ VoiceChat $v" --notes-file .github/release-notes.md --verify-tag
          }
          gh release upload $env:TAG "$($f.FullName)" --clobber
