<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EZ VoiceChat</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="bar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg class="mark" viewBox="30 0 965 965"><defs><clipPath id="hl1"><polygon points="0,0 556,0 407,600 0,600"/></clipPath><clipPath id="hr1"><polygon points="580,0 1024,0 1024,600 431,600"/></clipPath></defs><path d="M138 500 C138 140 886 140 886 500" fill="none" stroke="#AFAEAE" stroke-width="84" clip-path="url(#hl1)"/><path d="M138 500 C138 140 886 140 886 500" fill="none" stroke="#FECC13" stroke-width="84" clip-path="url(#hr1)"/><g transform="translate(138 610) skewX(-15)"><rect x="-58" y="-140" width="116" height="280" rx="40" fill="#AFAEAE"/><rect x="22" y="-104" width="22" height="208" rx="11" fill="#7d7c7c"/></g><g transform="translate(886 610) skewX(-15)"><rect x="-58" y="-140" width="116" height="280" rx="40" fill="#FECC13"/><rect x="-44" y="-104" width="22" height="208" rx="11" fill="#c99f00"/></g><g transform="translate(198.2 424.4) scale(0.33)"><path fill="#AFAEAE" d="M207 192H1000L813 355H413L392 433H984L785 593H348L323 682H860L619 872H17Z"/><path fill="#FECC13" d="M1055 192H1885L1290 682H1763L1538 872H681L1352 355H869Z"/></g></svg>
      <span data-tauri-drag-region>VOICECHAT</span>
    </div>
    <div id="status" class="pill idle"><i></i><span>Not connected</span></div>
    <div class="flex" data-tauri-drag-region></div>
    <div class="win">
      <button data-win="min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button data-win="close" class="close" title="Close (stays connected in the tray)"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div id="shell">
    <aside id="side">
      <div class="side-head"><span>Servers</span><button id="add-server" class="icon-btn" title="Add a server"></button></div>
      <div id="bookmarks"></div>
      <div class="flex"></div>
      <div id="me">
        <div class="avatar" id="me-avatar">?</div>
        <div class="me-info" id="me-info" title="Click to change your name"><b><span id="me-name">Set your name</span><svg class="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></b><small id="me-sub">Pick a server</small><input id="me-edit" class="me-edit" maxlength="64" placeholder="Your name" hidden></div>
        <button id="btn-mute" class="icon-btn" title="Mute microphone"></button>
        <button id="btn-deaf" class="icon-btn" title="Deafen"></button>
        <button id="btn-settings" class="icon-btn" title="Audio settings"></button>
      </div>
    </aside>

    <main id="main">
      <div id="server-head" hidden>
        <div>
          <h1 id="server-name"></h1>
          <div class="meta" id="server-meta"></div>
        </div>
        <div class="flex"></div>
        <button id="btn-disconnect" class="btn ghost">Disconnect</button>
      </div>
      <div id="tree" hidden></div>
      <div id="welcome"></div>
    </main>

    <aside id="chat">
      <div class="chat-head">Chat <small id="chat-where"></small></div>
      <div id="messages"></div>
      <form id="chat-form" autocomplete="off"><input id="chat-input" placeholder="Message your channel…" maxlength="2000" disabled /></form>
    </aside>
  </div>

  <div id="menu" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
