<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EZ VoiceChat overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font: 600 14px "Segoe UI", system-ui, sans-serif; color: #fff; }
    #list { position: absolute; display: flex; flex-direction: column; gap: 6px; }
    #list.tl { top: 0; left: 0; transform-origin: top left; }
    #list.tr { top: 0; right: 0; align-items: flex-end; transform-origin: top right; }
    #list.bl { bottom: 0; left: 0; transform-origin: bottom left; }
    #list.br { bottom: 0; right: 0; align-items: flex-end; transform-origin: bottom right; }
    .r { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 99px; background: rgba(8, 9, 11, .74); border: 1px solid rgba(255, 255, 255, .08); max-width: 280px; text-shadow: 0 1px 2px #000; }
    .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #2a2d34; font-size: 10px; font-weight: 800; flex: none; box-shadow: 0 0 0 2px transparent; }
    .av { overflow: hidden; }
    .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r.talking { border-color: rgba(57, 224, 122, .5); }
    .r.talking .av { box-shadow: 0 0 0 2px #39e07a, 0 0 10px rgba(57, 224, 122, .7); }
    .r.idle { opacity: .6; }
    .r.me .n { color: #ffd21f; }
    .r.warn { border-color: rgba(255, 79, 98, .55); color: #ff8a96; padding-left: 12px; font-size: 12px; }
    svg { width: 14px; height: 14px; fill: none; stroke: #ff4f62; stroke-width: 2; stroke-linecap: round; flex: none; }
  </style>
</head>
<body>
  <div id="list" class="tl"></div>
  <script src="overlay.js"></script>
</body>
</html>
